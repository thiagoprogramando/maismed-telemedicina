services:
    app:
        build:
            context: .
        restart: unless-stopped
        ports:
            - "127.0.0.1:${MAISMED_PORT:-8088}:8000"
        environment:
            APP_NAME: "MaisMed"
            APP_ENV: "local"
            APP_DEBUG: "true"
            APP_URL: "http://localhost:${MAISMED_PORT:-8088}/"
            APP_LOCALE: "pt_BR"
            APP_FALLBACK_LOCALE: "pt_BR"
            DB_CONNECTION: "sqlite"
            DB_DATABASE: "/var/www/html/storage/database.sqlite"
            SESSION_DRIVER: "database"
            CACHE_STORE: "database"
            QUEUE_CONNECTION: "database"
            MAIL_MAILER: "log"
            APP_SEED_DATABASE: "true"
            API_URL_ASSAS: ""
            API_TOKEN_ASSAS: ""
        volumes:
            - maismed_storage:/var/www/html/storage

volumes:
    maismed_storage:
